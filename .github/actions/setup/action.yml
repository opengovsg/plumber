name: 'Setup'
description: 'Install dependencies and restore Turbo cache for a CI job'

inputs:
  job-index:
    description: "Index of the current job within its matrix, if any. Composite actions can't read the caller's strategy context directly, so matrixed callers must pass it in explicitly to disambiguate their turbo cache key."
    required: false
    default: '0'
  npm-taskforcesh-token:
    description: 'Auth token for the @taskforcesh private registry. Composite actions cannot read secrets.* directly, so callers must forward it explicitly.'
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Configure taskforcesh registry auth
      # pnpm refuses to expand ${VAR} auth tokens from a project-committed .npmrc
      # (leak risk if the file were ever pointed at an attacker-controlled registry),
      # so the token is written to the runner's user-level pnpm config instead.
      shell: bash
      run: pnpm config set "//npm.taskforce.sh/:_authToken" "${{ inputs.npm-taskforcesh-token }}"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore turbo cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        # inputs.job-index disambiguates matrix legs sharing the same github.job, which would
        # otherwise race to reserve the same cache key. Defaults to 0 on non-matrix jobs.
        key: ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.job }}-${{ inputs.job-index }}-
