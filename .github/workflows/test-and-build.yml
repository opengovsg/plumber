name: Test and build

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update to supported npm
        # Latest version at PR time; we just need to support min-release-age
        run: npm install -g npm@11.19.0
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - name: Check packages are hoisted to root
        run: |
          for dir in packages/backend packages/frontend; do
            if [ -d "$dir/node_modules" ]; then
              echo "❌ Found node_modules in $dir — packages are not hoisted to root"
              exit 1
            fi
          done
          echo "✅ All packages are hoisted to root"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - run: npm run lint
      - run: echo "✅ Lint check passed."

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - run: npm run typecheck
      - run: echo "✅ Typecheck passed."

  typecheck-strict:
    name: Typecheck (strict)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - run: npm run typecheck:strict
      - run: echo "✅ Strict typecheck passed."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - run: VITE_MODE=test npm run build
      - run: echo "✅ Build check passed."

  test-backend-unit:
    name: Test (backend unit)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: npx turbo run test:unit --filter=backend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Backend unit tests passed."

  test-backend-integration:
    name: Test (backend integration)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: npx turbo run test:integration --filter=backend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Backend integration tests passed."

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Generate graphql artifacts
        run: npm run postinstall
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: npx turbo run test --filter=frontend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Frontend tests passed."
