name: Test and build

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply chain verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - name: Verify registry signatures
        run: pnpm audit signatures
      - name: Generate SBOM
        run: pnpm sbom --sbom-format cyclonedx --prod --out sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - run: pnpm run lint
      - run: echo "✅ Lint check passed."

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - run: pnpm run format
      - run: echo "✅ Format check passed."

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - run: pnpm run typecheck
      - run: echo "✅ Typecheck passed."

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - run: VITE_MODE=test pnpm run build
      - run: echo "✅ Build check passed."

  test-backend-unit:
    name: Test (backend unit)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@4e7afb05b464fd349275e41e65a7f4de83e7f46b # v2.10.0
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: pnpm exec turbo run test:unit --filter=backend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Backend unit tests passed."

  test-backend-integration:
    name: Test (backend integration)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@4e7afb05b464fd349275e41e65a7f4de83e7f46b # v2.10.0
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: pnpm exec turbo run test:integration --filter=backend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Backend integration tests passed."

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          npm-taskforcesh-token: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      - name: Configure Datadog Test Visibility
        env:
          DD_SERVICE_NAME: ${{ secrets.DD_SERVICE_NAME }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        uses: datadog/test-visibility-github-action@4e7afb05b464fd349275e41e65a7f4de83e7f46b # v2.10.0
        with:
          languages: js
          service: ${{ secrets.DD_SERVICE_NAME }}
          api_key: ${{ secrets.DD_API_KEY }}
          # we need to pin this for now since 5.68.0 breaks the ci
          js-tracer-version: 5.67.0
      - run: pnpm exec turbo run test --filter=frontend
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
      - run: echo "✅ Frontend tests passed."
