name: Deploy to staging

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - staging-v2
  # Pushes made with GITHUB_TOKEN (scheduled-release.yml) do not trigger the push
  # event above, so that workflow dispatches this one instead.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    # workflow_dispatch ignores the push.branches filter above.
    if: github.ref == 'refs/heads/staging-v2'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: 'staging'
      aws-account-id: '964715690079'
      cicd-role: 'arn:aws:iam::964715690079:role/plumber-staging-github-oidc-role'
      ecr-repository: 'plumber-staging'
      ecs-cluster-name: 'plumber-staging-ecs'
      ecs-service-name: 'plumber-staging-ecs-service'
      codedeploy-application: 'plumber-staging-ecs-app'
      codedeploy-deployment-group: 'plumber-staging-ecs-dg'
      release-version: ${{ github.sha }}
    secrets:
      NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
