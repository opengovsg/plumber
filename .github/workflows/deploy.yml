name: AWS Deploy
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      aws-account-id:
        description: 'AWS account ID to use'
        required: true
        type: string
      cicd-role:
        description: 'AWS IAM role to assume by GitHub action runner'
        required: true
        type: string
      ecr-repository:
        description: 'ECR repository to push image to'
        required: true
        type: string
      ecs-cluster-name:
        description: 'ECS cluster to deploy to'
        required: true
        type: string
      ecs-service-name:
        description: 'ECS service for server'
        required: true
        type: string
      codedeploy-application:
        description: 'CodeDeploy application to use'
        required: true
        type: string
      codedeploy-deployment-group:
        description: 'CodeDeploy deployment group to use'
        required: true
        type: string
      release-version:
        description: 'Version of release'
        required: true
        type: string
    secrets:
      NPM_TASKFORCESH_TOKEN:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2
        with:
          role-to-assume: ${{ inputs.cicd-role }}
          role-session-name: github-action-application-deploy
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1
        with:
          mask-password: 'true'

      - name: Construct ECR Image URI
        id: ecr-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and load image to ECR
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
        run: |
          docker build . -t ${{ steps.ecr-image-uri.outputs.image }} --build-arg APP_ENV=${{ inputs.environment }} --secret id=NPM_TASKFORCESH_TOKEN

      - name: Scan built image with Inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@baab69e77b34f244adef1f702d0fd69f2b3bc545 # v1
        id: inspector
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        with:
          artifact_type: 'container'
          artifact_path: '${{ steps.ecr-image-uri.outputs.image }}'
          # Thresholds live in the next step, because whole-image counts include
          # runtime and OS packages that must not page us.

      - name: Count vulnerabilities in Plumber app packages
        id: app-vulns
        env:
          SCAN_RESULTS: ${{ steps.inspector.outputs.inspector_scan_results }}
          # Path-segment match. A leading slash or image-layer prefix is allowed.
          # A trailing slash is not required.
          APP_PATH_PATTERN: opt/plumber/node_modules
          CRITICAL_THRESHOLD: 5
          HIGH_THRESHOLD: 10
        run: |
          set -euo pipefail

          report=$(jq --arg pattern "$APP_PATH_PATTERN" '
            def severity_rank: {"critical": 5, "high": 4, "medium": 3, "low": 2}[.] // 1;
            def is_app_path: test("(^|/)" + $pattern + "(/|$)");
            def is_malware:
              ((.id // "") | startswith("MAL-"))
              or (([.properties[]? | select(.name == "amazon:inspector:sbom_scanner:is_malicious") | .value] | index("true")) != null);
            def is_dockerfile: ((.id // "") | startswith("IN-DOCKER"));

            if has("sbom") | not then
              {sbom: false, app_components: 0, scanned: 0, located: 0,
               app_malware: 0, critical: 0, high: 0, medium: 0, low: 0, other: 0}
            else
              [.sbom.components[]? | recurse(.components[]?)] as $components
              | ([$components[]
                  | select(has("bom-ref"))
                  | {key: .["bom-ref"],
                     value: [.properties[]?
                             | select(.name == "amazon:inspector:sbom_scanner:path"
                                      or .name == "amazon:inspector:sbom_generator:source_path")
                             | .value]}]
                 | from_entries) as $paths
              | ($paths
                 | [.[]] | flatten
                 | map(select(type == "string" and is_app_path))
                 | unique | length) as $app_components
              | [.sbom.vulnerabilities[]?
                 | select(is_dockerfile | not)
                 | {id: (.id // "unknown"),
                    malware: is_malware,
                    paths: [.affects[]?.ref | $paths[.]? // [] | .[]],
                    rank: ([.ratings[]?
                            | select((.method == "other" and (.source.name? // "") == "EPSS") | not)
                            | .severity? | select(. != null) | ascii_downcase | severity_rank] | max // 1)}]
              | . as $findings
              | ($findings | map(select((.paths | any(is_app_path)) and .malware))) as $app_malware
              | ($findings | map(select(.paths | any(is_app_path)))) as $app_findings
              | {sbom: true,
                 app_components: $app_components,
                 scanned: ($findings | length),
                 located: ($findings | map(select(.paths | length > 0)) | length),
                 app_malware: ($app_malware | length)}
                + ($app_findings
                   | group_by(.id)
                   | map({rank: (map(.rank) | max)})
                   | {critical: (map(select(.rank == 5)) | length),
                      high: (map(select(.rank == 4)) | length),
                      medium: (map(select(.rank == 3)) | length),
                      low: (map(select(.rank == 2)) | length),
                      other: (map(select(.rank == 1)) | length)})
            end
          ' "$SCAN_RESULTS")

          echo "Package vulnerabilities in $APP_PATH_PATTERN"
          jq -r 'to_entries | map("  \(.key): \(.value)") | .[]' <<< "$report"

          sbom=$(jq -r '.sbom' <<< "$report")
          app_components=$(jq -r '.app_components' <<< "$report")
          scanned=$(jq -r '.scanned' <<< "$report")
          located=$(jq -r '.located' <<< "$report")
          app_malware=$(jq -r '.app_malware' <<< "$report")
          critical=$(jq -r '.critical' <<< "$report")
          high=$(jq -r '.high' <<< "$report")

          for value in "$app_components" "$scanned" "$located" "$app_malware" "$critical" "$high"; do
            case "$value" in
              ''|*[!0-9]*)
                echo "::warning::App vulnerability count produced a non-integer. Review the full scan."
                {
                  echo "summary=App vulnerability count failed validation. Review the full scan."
                  echo "threshold_exceeded=1"
                } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          # Fail loud when the filter cannot see Plumber app packages. A silent
          # zero would hide both CVEs and malware.
          if [ "$sbom" != "true" ] || [ "$app_components" -eq 0 ] || { [ "$scanned" -gt 0 ] && [ "$located" -eq 0 ]; }; then
            echo "::warning::Could not map Inspector findings onto $APP_PATH_PATTERN; app-only filter is not working."
            {
              echo "summary=Could not map findings to app packages, so the app-only filter did not run. Review the full scan."
              echo "threshold_exceeded=1"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          threshold_exceeded=0
          if [ "$app_malware" -gt 0 ] || [ "$critical" -ge "$CRITICAL_THRESHOLD" ] || [ "$high" -ge "$HIGH_THRESHOLD" ]; then
            threshold_exceeded=1
          fi

          echo "Thresholds: critical >= $CRITICAL_THRESHOLD, high >= $HIGH_THRESHOLD, malware > 0"
          echo "Threshold exceeded: $threshold_exceeded"

          {
            echo "summary=Plumber app packages: $critical critical, $high high, $app_malware malware."
            echo "threshold_exceeded=$threshold_exceeded"
          } >> "$GITHUB_OUTPUT"

      - name: Display CycloneDX SBOM (JSON)
        run: cat ${{ steps.inspector.outputs.artifact_sbom }}

      - name: Display Inspector vulnerability scan results (JSON)
        run: cat ${{ steps.inspector.outputs.inspector_scan_results }}

      - name: Upload Scan Results
        id: upload-scan-results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: |
            ${{ steps.inspector.outputs.inspector_scan_results }}
            ${{ steps.inspector.outputs.inspector_scan_results_csv }}
            ${{ steps.inspector.outputs.inspector_scan_results_markdown }}
            ${{ steps.inspector.outputs.artifact_sbom }}
          retention-days: 7

      - name: Notify Slack if app vulnerability threshold is exceeded
        if: steps.app-vulns.outputs.threshold_exceeded == '1'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            username: "Plumber Deployment Scanner"
            text: ":warning: *Vulnerability threshold exceeded* in `${{ inputs.environment }}` deploy (version `${{ inputs.release-version }}`). ${{ steps.app-vulns.outputs.summary }} Uploaded scan results also cover runtime and OS packages: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push image to ECR after scan passes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: |
          docker push ${{ steps.ecr-image-uri.outputs.image }}

      - name: (Archival) Construct ECR image URI
        id: ecr-archival-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}-archival
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: (Archival) Build and push image to ECR
        env:
          DOCKER_BUILDKIT: 1
          NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
        run: |
          docker build . -f Dockerfile.archival -t ${{ steps.ecr-archival-image-uri.outputs.image }} --build-arg APP_ENV=${{ inputs.environment }} --secret id=NPM_TASKFORCESH_TOKEN
          docker push ${{ steps.ecr-archival-image-uri.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2
        with:
          role-to-assume: ${{ inputs.cicd-role }}
          role-session-name: github-action-application-deploy
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1
        with:
          mask-password: 'true'

      - name: Construct ECR Image URI
        id: ecr-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Merge ECS task definition templates
        id: merge-ecs-templates
        run: |
          cp ecs/task-definition.json ecs-task-definition.json
          echo $(jq --argjson environment "$(jq '.environment' ecs/env.json)" '.containerDefinitions[0].environment += $environment' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson secrets "$(jq '.secrets' ecs/env.json)" '.containerDefinitions[0].secrets += $secrets' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson environment "$(jq '.environment' ecs/env.json)" '.containerDefinitions[1].environment += $environment' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson secrets "$(jq '.secrets' ecs/env.json)" '.containerDefinitions[1].secrets += $secrets' ecs-task-definition.json) > ecs-task-definition.json
          cp ecs/appspec.json appspec.json

      - name: Replace variables in task definition file
        run: |
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' ecs-task-definition.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' ecs-task-definition.json
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' appspec.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' appspec.json

      - name: (Server) Fill in the new image ID in the Amazon ECS task definition
        id: server-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ecs-task-definition.json
          container-name: server
          image: ${{ steps.ecr-image-uri.outputs.image }}

      - name: (Worker) Fill in the new image ID in the Amazon ECS task definition
        id: full-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ${{ steps.server-task-def.outputs.task-definition }}
          container-name: worker
          image: ${{ steps.ecr-image-uri.outputs.image }}

      - name: Deploy Amazon ECS task definition to server
        uses: aws-actions/amazon-ecs-deploy-task-definition@69e7aed9b8acdd75a6c585ac669c33831ab1b9a3 # v1
        with:
          task-definition: ${{ steps.full-task-def.outputs.task-definition }}
          cluster: ${{ inputs.ecs-cluster-name }}
          service: ${{ inputs.ecs-service-name }}
          wait-for-service-stability: false
          codedeploy-appspec: appspec.json
          codedeploy-application: ${{ inputs.codedeploy-application }}
          codedeploy-deployment-group: ${{ inputs.codedeploy-deployment-group }}

      - name: (Archival) Construct ECR image URI
        id: ecr-archival-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}-archival
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: (Archival) Replace variables in task definition
        run: |
          cp ecs/archival-task-definition.json ecs-archival-task-definition.json
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' ecs-archival-task-definition.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' ecs-archival-task-definition.json

      - name: (Archival) Fill in the new image ID in the Amazon ECS task definition
        id: archival-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ecs-archival-task-definition.json
          container-name: archival
          image: ${{ steps.ecr-archival-image-uri.outputs.image }}

      - name: (Archival) Register task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://${{ steps.archival-task-def.outputs.task-definition }}
