name: AWS Deploy
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      aws-account-id:
        description: 'AWS account ID to use'
        required: true
        type: string
      cicd-role:
        description: 'AWS IAM role to assume by GitHub action runner'
        required: true
        type: string
      ecr-repository:
        description: 'ECR repository to push image to'
        required: true
        type: string
      ecs-cluster-name:
        description: 'ECS cluster to deploy to'
        required: true
        type: string
      ecs-service-name:
        description: 'ECS service for server'
        required: true
        type: string
      codedeploy-application:
        description: 'CodeDeploy application to use'
        required: true
        type: string
      codedeploy-deployment-group:
        description: 'CodeDeploy deployment group to use'
        required: true
        type: string
      release-version:
        description: 'Version of release'
        required: true
        type: string
    secrets:
      NPM_TASKFORCESH_TOKEN:
        required: true
      SLACK_BOT_TOKEN:
        required: true
      SLACK_CHANNEL_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ inputs.cicd-role }}
          role-session-name: github-action-application-deploy
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Construct ECR Image URI
        id: ecr-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and load image to ECR
        id: build-image
        env:
          DOCKER_BUILDKIT: 1
          NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
        run: |
          docker build . -t ${{ steps.ecr-image-uri.outputs.image }} --build-arg APP_ENV=${{ inputs.environment }} --secret id=NPM_TASKFORCESH_TOKEN

      - name: Scan built image with Inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        id: inspector
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        with:
          artifact_type: 'container'
          artifact_path: '${{ steps.ecr-image-uri.outputs.image }}'
          critical_threshold: 5
          high_threshold: 10

      - name: Display CycloneDX SBOM (JSON)
        run: cat ${{ steps.inspector.outputs.artifact_sbom }}

      - name: Display Inspector vulnerability scan results (JSON)
        run: cat ${{ steps.inspector.outputs.inspector_scan_results }}

      - name: Upload Scan Results
        id: upload-scan-results
        uses: actions/upload-artifact@v4
        with:
          path: |
            ${{ steps.inspector.outputs.inspector_scan_results }}
            ${{ steps.inspector.outputs.inspector_scan_results_csv }}
            ${{ steps.inspector.outputs.inspector_scan_results_markdown }}
            ${{ steps.inspector.outputs.artifact_sbom }}

      - name: Notify Slack if vulnerability threshold is exceeded
        if: steps.inspector.outputs.vulnerability_threshold_exceeded == '1'
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            username: "Plumber Deployment Scanner"
            text: ":warning: *Vulnerability threshold exceeded* in `${{ inputs.environment }}` deploy (version `${{ inputs.release-version }}`). Review scan results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push image to ECR after scan passes
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: |
          docker push ${{ steps.ecr-image-uri.outputs.image }}

      - name: (Archival) Construct ECR image URI
        id: ecr-archival-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}-archival
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: (Archival) Build and push image to ECR
        env:
          DOCKER_BUILDKIT: 1
          NPM_TASKFORCESH_TOKEN: ${{ secrets.NPM_TASKFORCESH_TOKEN }}
        run: |
          docker build . -f Dockerfile.archival -t ${{ steps.ecr-archival-image-uri.outputs.image }} --build-arg APP_ENV=${{ inputs.environment }} --secret id=NPM_TASKFORCESH_TOKEN
          docker push ${{ steps.ecr-archival-image-uri.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ inputs.cicd-role }}
          role-session-name: github-action-application-deploy
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Construct ECR Image URI
        id: ecr-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Merge ECS task definition templates
        id: merge-ecs-templates
        run: |
          cp ecs/task-definition.json ecs-task-definition.json
          echo $(jq --argjson environment "$(jq '.environment' ecs/env.json)" '.containerDefinitions[0].environment += $environment' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson secrets "$(jq '.secrets' ecs/env.json)" '.containerDefinitions[0].secrets += $secrets' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson environment "$(jq '.environment' ecs/env.json)" '.containerDefinitions[1].environment += $environment' ecs-task-definition.json) > ecs-task-definition.json
          echo $(jq --argjson secrets "$(jq '.secrets' ecs/env.json)" '.containerDefinitions[1].secrets += $secrets' ecs-task-definition.json) > ecs-task-definition.json
          cp ecs/appspec.json appspec.json

      - name: Replace variables in task definition file
        run: |
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' ecs-task-definition.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' ecs-task-definition.json
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' appspec.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' appspec.json

      - name: (Server) Fill in the new image ID in the Amazon ECS task definition
        id: server-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: server
          image: ${{ steps.ecr-image-uri.outputs.image }}

      - name: (Worker) Fill in the new image ID in the Amazon ECS task definition
        id: full-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.server-task-def.outputs.task-definition }}
          container-name: worker
          image: ${{ steps.ecr-image-uri.outputs.image }}

      - name: Deploy Amazon ECS task definition to server
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.full-task-def.outputs.task-definition }}
          cluster: ${{ inputs.ecs-cluster-name }}
          service: ${{ inputs.ecs-service-name }}
          wait-for-service-stability: false
          codedeploy-appspec: appspec.json
          codedeploy-application: ${{ inputs.codedeploy-application }}
          codedeploy-deployment-group: ${{ inputs.codedeploy-deployment-group }}

      - name: (Archival) Construct ECR image URI
        id: ecr-archival-image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}-archival
          IMAGE_TAG: ${{ inputs.environment }}-${{ inputs.release-version }}
        run: echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: (Archival) Replace variables in task definition
        run: |
          cp ecs/archival-task-definition.json ecs-archival-task-definition.json
          sed -i 's/<AWS_ACCOUNT_ID>/${{ inputs.aws-account-id }}/g' ecs-archival-task-definition.json
          sed -i 's/<ENVIRONMENT>/${{ inputs.environment }}/g' ecs-archival-task-definition.json

      - name: (Archival) Fill in the new image ID in the Amazon ECS task definition
        id: archival-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-archival-task-definition.json
          container-name: archival
          image: ${{ steps.ecr-archival-image-uri.outputs.image }}

      - name: (Archival) Register task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://${{ steps.archival-task-def.outputs.task-definition }}
