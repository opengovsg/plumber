type Query {
  getApp(key: String!, flowId: String): App
  getConnectedApps: [App]
  testConnection(
    connectionId: String!
    flowId: String
    supportsConnectionRegistration: Boolean
  ): TestConnectionResult
  getFlow(id: String!): Flow
  getFlows(
    limit: Int!
    offset: Int!
    appKey: String
    connectionId: String
    name: String
    active: Boolean
  ): PaginatedFlows
  getTestExecutionSteps(
    flowId: String!
    ignoreTestExecutionId: Boolean
  ): [ExecutionStep]
  getExecution(executionId: String!): Execution
  getExecutions(
    limit: Int!
    offset: Int!
    flowId: String!
    status: String
  ): PaginatedExecutions
  getExecutionSteps(
    executionId: String!
    limit: Int!
    offset: Int!
    iteration: Int
  ): PaginatedExecutionSteps
  getDynamicData(
    stepId: String!
    key: String!
    parameters: JSONObject
  ): [JSONObject]
  getFlowConnections(flowId: String!): [SharedFlowConnection!]!
  # Tiles
  getTable(tableId: String!): TableMetadata!
  getTableConnections(tableIds: [String!]!): JSONObject
  getTables(limit: Int!, offset: Int!, name: String): PaginatedTables!
  # Tiles rows
  getAllRows(tableId: String!, stringifiedCursor: String): GetTableRowsResult!
  getCurrentUser: User
  healthcheck: AppHealth
  getPlumberStats: Stats
  # Flow transfers
  getPendingFlowTransfers: [FlowTransfer!]!
  getFlowTransferDetails(flowId: String!): [StepTransferDetails]!
  # Admin queries
  admin: AdminQuery!
  # Templates (including demo templates)
  getTemplates(tag: TemplateTagType): [Template!]!
}

type AdminQuery {
  getFlowOwner(flowId: String!): User
  getExecutionOwner(executionId: String!): User
  getTableOwner(tableId: String!): User
  searchUsersByEmail(query: String!): [User!]!
  getPausedGroups(appKey: String!): [String!]!
}

type Mutation {
  createConnection(input: CreateConnectionInput): Connection
  generateAuthUrl(input: GenerateAuthUrlInput): AuthLink
  updateConnection(input: UpdateConnectionInput): Connection
  resetConnection(input: ResetConnectionInput): Connection
  verifyConnection(input: VerifyConnectionInput): Connection
  deleteConnection(input: DeleteConnectionInput): Boolean
  registerConnection(input: RegisterConnectionInput): Boolean
  # Flows
  createFlow(input: CreateFlowInput): Flow
  createFlowWithSteps(input: CreateFlowWithStepsInput): Flow
  createTemplatedFlow(input: CreateTemplatedFlowInput): Flow
  updateFlow(input: UpdateFlowInput): Flow
  updateFlowStatus(input: UpdateFlowStatusInput): Flow
  updateFlowConfig(input: UpdateFlowConfigInput): Flow
  executeStep(input: ExecuteStepInput): ExecutionStep!
  deleteFlow(input: DeleteFlowInput): Boolean
  createStep(input: CreateStepInput): Step
  updateStep(input: UpdateStepInput): Step
  updateStepPositions(input: UpdateStepPositionsInput): Flow
  deleteStep(input: DeleteStepInput): Flow
  requestOtp(input: RequestOtpInput): Boolean
  verifyOtp(input: VerifyOtpInput): Boolean
  retryExecutionStep(input: RetryExecutionStepInput): Boolean
  retryPartialStep(input: RetryPartialStepInput!): Boolean
  bulkRetryExecutions(
    input: BulkRetryExecutionsInput
  ): BulkRetryExecutionsResult!
  bulkRetryIterations(
    input: BulkRetryIterationsInput
  ): BulkRetryIterationsResult!
  dynamicAction(input: DynamicActionInput!): JSONObject!
  logout: LogoutResult
  loginWithSgid(input: OidcLoginInput!): LoginWithSgidResult!
  loginWithSso(input: OidcLoginInput!): Boolean!
  loginWithSelectedSgid(
    input: LoginWithSelectedSgidInput!
  ): LoginWithSelectedSgidResult!
  duplicateBranch(input: DuplicateBranchInput): DuplicateBranchResult
  duplicateFlow(input: DuplicateFlowInput): Flow
  # Flow collaborators
  upsertFlowCollaborator(input: FlowCollaboratorInput!): Boolean!
  deleteFlowCollaborator(input: DeleteFlowCollaboratorInput!): Boolean!
  deleteFlowConnection(input: DeleteFlowConnectionInput!): Boolean!
  # S3 operations
  generatePresignedPost(input: GeneratePresignedPostInput): PresignedPostObject
  deleteUploadedFile(id: String!, flowUpdatedAt: String!): Boolean
  # Tiles
  createTable(input: CreateTableInput!): TableMetadata!
  createShareableTableLink(tableId: ID!): String!
  deleteShareableTableLink(tableId: ID!): Boolean!
  setTableViewPassword(input: SetTableViewPasswordInput!): Boolean!
  deleteTableViewPassword(tableId: ID!): Boolean!
  verifyTableViewPassword(input: VerifyTableViewPasswordInput!): String!
  updateTable(input: UpdateTableInput!): TableMetadata!
  deleteTable(input: DeleteTableInput!): Boolean!
  # Tiles rows
  createRow(input: CreateTableRowInput!): ID!
  createRows(input: CreateTableRowsInput!): Boolean
  updateRow(input: UpdateTableRowInput!): ID!
  deleteRows(input: DeleteTableRowsInput!): [ID!]!
  # Tiles collaborators
  upsertTableCollaborator(input: TableCollaboratorInput!): Boolean!
  deleteTableCollaborator(input: DeleteTableCollaboratorInput!): Boolean!
  # Flow transfers
  createFlowTransfer(input: CreateFlowTransferInput!): FlowTransfer!
  updateFlowTransferStatus(input: UpdateFlowTransferStatusInput): FlowTransfer!
  # Ai builder mutations
  updateChatFeedback(input: UpdateChatFeedbackInput!): Boolean!
  # Admin mutations
  admin: AdminMutation!
}

